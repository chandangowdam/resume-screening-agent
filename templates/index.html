<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Screening System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>🤖 AI Resume Screening System</h1>

    <p>
        Upload a Job Description and multiple resumes.
        The AI will rank the candidates automatically.
    </p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <h3>Upload Job Description</h3>

        <input type="file" name="jd" required>

        <br><br>

        <h3>Upload Resumes</h3>

        <input type="file" name="resumes" multiple required>

        <br><br>

        <button type="submit">Analyze Resumes</button>

    </form>

</div>

</body>
</html>
